name: Codesign Quick Test with preinstalled paths

on:
    pull_request:
        branches: master
    workflow_dispatch:
            
            
jobs:
  test:
    name: Codesign Preinstalled Quicktest
    runs-on: self-hosted
    steps:
        - name: Remove old workspace
          run: |
            rm -rf *
            rm -rf .[^.] .??*
            ls -la
        - name: Check out repository code
          uses: actions/checkout@v4
        - name: Debug-echo
          run: |
              echo ">>> CI is running inside Python Tests workflow on $(date)"
              echo "Current directory: $(pwd)"
              ls -la
        - name: Set up preinstalled tool environment
          run: |
            export OPENROAD_PRE_INSTALLED=1
            export SCALEHLS_PRE_INSTALLED=1
            export STREAMHLS_PRE_INSTALLED=1
            export PREINSTALLED_OPENROAD_PATH="/scratch/seunghyeok/codesign/openroad_interface/OpenROAD/build/src/openroad"
            export PREINSTALLED_STREAMHLS_PATH="/scratch/seunghyeok/codesign/Stream-HLS/"
            export PREINSTALLED_SCALEHLS_PATH="/scratch/seunghyeok/codesign/ScaleHLS-HIDA/"
            python check_env_vars.py
            chmod +x full_env_start.sh || true
            ./full_env_start.sh
        - name: Run Codesign Script
          run: |
              chmod +x test/automated_test_scripts/automated-scripts.sh || true
              ./test/automated_test_scripts/automated-scripts.sh