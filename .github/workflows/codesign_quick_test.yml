name: Codesign Quick Testing Workflow
env:
  OPENROAD_PREINSTALLED: 1
  PREINSTALLED_OPENROAD_PATH: "/scratch/openroad_executable/openroad"
  SCALEHLS_PREINSTALLED: 1
  PREINSTALLED_SCALEHLS_PATH: "/scratch/seunghyeok/codesign/ScaleHLS-HIDA"
  STREAMHLS_PREINSTALLED: 1
  PREINSTALLED_STREAMHLS_PATH: "/scratch/seunghyeok/Stream-HLS"


on:
  workflow_dispatch:

  pull_request:
    branches:
      - master
      - main
jobs:
    test:
        name: Codesign Quick Test
        runs-on: self-hosted
        steps:
          - name: Remove old workspace
            run: |
              rm -rf *
              rm -rf .[^.] .??*
              ls -la

          - name: Debug-echo
            run: |
              echo ">>> CI is running inside Python Tests workflow on $(date)"
              echo "Current directory: $(pwd)"
              ls -la

          - name: Check out repository
            uses: actions/checkout@v5

          - name: Debug-echo
            run: |
              echo ">>> CI is running inside Python Tests workflow on $(date)"
              echo "Current directory: $(pwd)"
              ls -la

          - name: Start Env
            run: ./full_env_start.sh

          - name: Run regressions
            run: |
              chmod +x test/automated_test_scripts/automated-scripts.sh || true
              ./test/automated_test_scripts/automated-scripts.sh

          - name: Confirm End
            run: echo "Quick Test Done"